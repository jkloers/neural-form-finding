# Closed-state RDPQK — 4 ft x 8 ft sheet (1219.2 x 2438.4 mm), 9 panels, 12 hinges.
# ROM VARIANT of sheet_4x8ft.yaml — identical in every respect EXCEPT `hinge_model.type: rom`,
# so the two runs isolate the hinge model and nothing else (same target, same loads, same BCs).
#
# HINGE MODEL. `rom` = the linear-spring ligament (`ligament_energy_linearized`), driven by the
# `material:` k_stretch / k_shear / k_rot below. Those constants are INERT in the surrogate run and
# LIVE here — this is the abstract spring model, not the condensed CalculiX energy.
#
# ⚠ UNITS. `length_scale` / `energy_scale` are read ONLY in the surrogate branch of
# `nff/closed/setup.py`, so under the ROM they do nothing and **`loads.value` is NOT in newtons** —
# it is an abstract force against k_stretch=1000. Kept at 60.0 purely to match the surrogate run's
# config; do not read it as 60 N. Measured untrained ROM sweep (state rebuilt per force):
#   F=60 -> w 5.483 h 6.892 | 300 -> 5.512 / 7.382 | 1000 -> 5.501 / 8.789 | 20000 -> 5.486 / 46.796
# Width is force-INDEPENDENT (hinge opening is set by k_rot, saturated at ~0 load) while height is
# exactly LINEAR in force and never saturates — springs that cannot yield. Contrast the surrogate,
# which spreads auxetically (+23% lateral at 60 N) and saturates by 160 N.
#
# ⚠ NO DAMAGE. The ROM branch returns `(None,)*5`, so there is no damage_fn: `w_damage`, `w_fail`,
# `w_ood`, `m_safe`, `fail_line` and `learn_w_lig` are all inert, the maxD/meanD/over columns vanish
# from the log, and w_lig stays uniform at 5.0 mm (so the cut export has identical hinges).
# `physics.backward_reg` is harmless but unnecessary — linear springs give a positive-definite
# Hessian, whereas it is load-bearing under the surrogate's plastic softening.

tessellation:
  tessellation_type: closed_rdpqk
  M: 3
  N: 3
  r_init: 0.45
  spacing: 1.0
  spacing_y: 2.0             # elongated panels -> 1:2 sheet from a 3x3 grid
  sheet_width_mm: 1219.2     # 4 ft of stock across M panels -> cut pattern exports at true size
  hinge_margin: 0.13
  clamped_dofs: [1]          # bottom edge: y only (rollers in x, free rotation)
  y_pin_faces: [3]           # centre bottom tile also pinned in x -> no rigid translation/rotation
  # FIXED target (never auto-fit). Measured untrained deploy at 60 N/tile: x [-0.337, 3.341],
  # y [-0.053, 6.254]. The target asks for MORE lateral spread (half_w 1.84 -> 2.05, +11%) and
  # slightly LESS extension (half_h 3.15 -> 3.00), i.e. convert the same pull into transverse
  # expansion. Its bottom edge is anchored on the clamped edge (y_lo = -0.053) so the pinned tiles
  # stay inside the target — otherwise their chamfer error is unfixable.
  target_cx: 1.502
  target_cy: 2.947
  target_half_w: 2.05
  target_half_h: 3.00

mapping:
  map_type: closed_les

optimization_weights:
  validity_method: none

hinge_model:
  type: rom
  checkpoint: data/surrogates/hinge_surrogate_v2.pkl   # merged campaign (S235, D-label)
  material: S235
  thickness_mm: 1.5          # 16-gauge sheet, a real 4x8 stock thickness
  w_lig_mm: 5.0              # ligament width [mm]; learnable per hinge over the trained [1, 10]
  calibrate: false
  length_scale: 406.4        # mm per pipeline unit = the real panel pitch
  energy_scale: 2.4606e-3    # 1 / length_scale -> load values are newtons
  barrier: 0.05
  w_damage: 10.0             # PRIMARY: continuous mean(D^2) over all hinges, threshold-free
  w_fail: 0.0
  w_ood: 1.0e-3
  m_safe: 1.0
  fail_line: 1.0             # reporting overlay only (count of hinges past fracture initiation)
  learn_w_lig: true

physics:
  use_contact: false
  linearized_strains: true
  incremental: true
  num_load_steps: 6
  solver_maxiter: 1500
  solver_tol: 1.0e-5
  backward_reg: 0.01         # ridge on the IFT adjoint (plastic softening makes the Hessian indefinite)
  updated_lagrangian: false

material:                    # inert with the surrogate + calibrate:false (kept for reference)
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [0, 3, 6]   # bottom edge (j = 0)

loads:                       # top edge (j = 2) pulled +y — distributed, not a single grip.
  - {face: 2, dof: 1, value: 60.0}    # 60 N per tile (180 N total). Measured untrained sweep:
  - {face: 5, dof: 1, value: 60.0}    #   10 N -> rigid (maxD 0.08); 30 N -> maxD 0.92, 0/12 past
  - {face: 8, dof: 1, value: 60.0}    #   fracture initiation; 60 N -> +23% lateral spread, maxD
                                      #   2.30, 10/12 past; 160 N -> +78% spread but saturating.
                                      # 60 N is the regime with real deployment AND reducible damage.

target:
  type: rectangle
  center: [1.5, 2.95]
  radius: 3.0

loss_weights:
  chamfer: 50.0
  coverage: 1.0
  stretching: 0.0
  shearing: 0.0
  bending: 0.0
  contact: 0.0
  material_area: 0.0
  hinge_gap: 0.0
  openness: 0.0
  deformation: 0.0
  void_closure: 0.0
  closure_delta: 0.0
  regularization: 1.0e-4

training:
  num_epochs: 200
  learning_rate: 0.01
  optimizer: adam
  lr_schedule: cosine
  grad_clip: 1.0
  geometric_loss_type: boundary_vertices

visualization:
  stage0: true               # flat trained sheet (the design the map produced)
  stage1: false              # Stage 1 is BYPASSED here (validity_method: none) — the plot is empty
  stage2: true               # deployed equilibrium + target
  energy_plot: true          # ⚠ energy_balance.png is NOT valid for a surrogate run: the
                             # decomposition (build_decompose_energy_fn) is hard-wired to the
                             # linear-spring ligament and has no bond_energy_fn hook, so it reports
                             # U_int from springs this solve never used (~0 here, since closed hinges
                             # have ~zero reference bond length) and the balance Sigma≈0 fails by
                             # construction. `work` is derived from that same U_int, so it is off too.
                             # The solver's own total potential (solution.energies) IS correct.
  animation: true            # deployment animation over the load steps
  show_plots: false
  save_outputs: true
  show_external_forces: false   # per-face arrows are clutter; the loading diagram carries the BCs
  show_kinematic_blocks: true
