# Quick start: the smallest complete closed-pipeline problem, runnable from a fresh clone.
# A 4x4 closed RDPQK sheet, one panel clamped, a moment on its neighbour, deployed by the linear-
# spring (ROM) hinge energy onto a circle. No surrogate checkpoint needed. About 30 s on a laptop CPU.
# For the learned hinge energy see circle_4x4_surrogate.yaml (needs data/surrogates/).
#
tessellation:
  tessellation_type: closed_rdpqk
  M: 4
  N: 4
  r_init: 0.45
  spacing: 1.0

mapping:
  map_type: closed_les

optimization_weights:
  validity_method: none

# ── Hinge energy: the config switch (ROM vs learned surrogate) ──
hinge_model:
  type: rom                       # rom | surrogate
  checkpoint: data/surrogates/hinge_surrogate.pkl
  material: S235                   # oversight: E=210 GPa, sigma_y=235 MPa, eps_f=0.25 (what it was trained for)
  thickness_mm: 1.0               # fixed by the surrogate
  w_lig_mm: 5.0                   # manufacturing choice, in [1, 10] mm
  calibrate: true                 # auto Gap-2 scale to k_stretch/k_rot
  barrier: 0.05                   # OOD validity barrier

physics:
  use_contact: false
  linearized_strains: true
  incremental: true
  num_load_steps: 12
  solver_maxiter: 1000
  solver_tol: 1.0e-5
  updated_lagrangian: false

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [5]

loads:
  - face: 6
    dof: 2                        # moment (Mz, CCW +)
    value: 0.3                    # sub-yield (circle_4x4_moment uses 2.0 = super-yield for the surrogate)

target:
  type: circle
  center: [2.0, 2.0]
  radius: 2.5

loss_weights:
  chamfer: 1.0
  coverage: 0.5
  stretching: 0.01
  shearing: 0.01
  bending: 0.001
  regularization: 1.0e-4

training:
  num_epochs: 40
  learning_rate: 0.02
  optimizer: adam
  lr_schedule: cosine
  grad_clip: 1.0
  geometric_loss_type: boundary_vertices

visualization:
  stage0: false
  stage1: false
  stage2: false
  energy_plot: false
  animation: false
  show_plots: false
  save_outputs: false
