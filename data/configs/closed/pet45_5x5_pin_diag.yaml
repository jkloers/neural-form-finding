# ── 5x5 PET SHEET — DIAGONAL PIN-AND-PULL. Pin face 0 (bottom-left), pull face 24 (top-right). ──
#
# THE PROBLEM, as posed: ONE supported tile at the bottom left holding x and y but NOT rotation,
# and ONE pulled tile at the top right. Nothing else is restrained.
#
# Controlled variation of `pet45_5x5_1t_baseline.yaml` -- same sheet, same checkpoint, same barrier,
# same loss weights, same seeded start. Only the SUPPORTS and the loaded tile change, which is the
# whole point: the supports ARE the problem statement.
#
# Face index = column * N + row, so face 0 = (col 0, row 0) = bottom-left and face 24 = (col 4,
# row 4) = top-right. The pull is therefore along the sheet DIAGONAL, not down a column.
#
# ⚠⚠ THIS PROBLEM IS NOT STATICALLY DETERMINATE, BY CONSTRUCTION. A pin leaves rotation free at
# face 0, and with no second support the whole assembly may rotate rigidly about that pin. That
# mode has zero stiffness, so it is not a numerical defect to be tuned away -- it is a degree of
# freedom the problem statement leaves open, and the pull feeds it continuously. The load below is
# calibrated in its presence; read `swing` in the run report alongside theta, and do not compare
# the deployed bbox against an axis-aligned target without also reporting the tilt.
#
# The force is calibrated for THIS problem, not inherited: a single-tile grip spans ~4.8x in force
# across the family, and the roller that carried part of the load in the 1t baseline is gone here.
#
tessellation:
  tessellation_type: closed_rdpqk
  M: 5
  N: 5
  r_init: 0.45
  spacing: 1.0
  spacing_y: 2.0             # elongated panels -> 1:2 sheet, same aspect as the 3x3 baseline
  sheet_width_mm: 2032.0     # = 5 * 406.4, i.e. the SAME panel pitch as the 3x3 config
  hinge_margin: 0.13
  clamped_dofs: [0, 1]       # ★ PIN, NOT A CLAMP: x and y fixed, ROTATION FREE on face 0.
  # ⚠ NO y_roller_faces. Both departures from `pet45_5x5_1t_baseline.yaml` are deliberate and
  # both REMOVE restraint, so the assembly carries a rigid-body rotation mode about the pin.
  # Under a fixed +y pull at face 24 the moment about the pin is F * (x24 - x0), which the
  # mechanism relieves by SWINGING until the pull passes through the pin -- see the banner.
  init_noise: 0.25           # seeded random start; see the banner
  init_seed: 7
  # Face index = column * N + row, so column c's bottom tile is c*5 and its top tile is c*5 + 4.
  target_cx: 3.3039
  target_cy: 5.4695
  target_half_w: 4.0593
  target_half_h: 5.5535

mapping:
  map_type: closed_les

optimization_weights:
  validity_method: none

hinge_model:
  type: surrogate
  checkpoint: data/surrogates/hinge_surrogate_pet_v3.pkl
  material: PET
  thickness_mm: 0.5
  w_lig_mm: 18.0
  calibrate: false
  length_scale: 406.4        # mm per pipeline unit = the real panel pitch, UNCHANGED from 3x3
  energy_scale: 2.4606e-3    # 1 / length_scale -> load values are newtons
  barrier: 0.5
  fail_line: 1.0
  learn_w_lig: true

physics:
  use_contact: true
  k_contact: 1000000.0
  min_angle: -2.0            # DEGREES
  cutoff_angle: 0.0
  linearized_strains: true
  incremental: true
  num_load_steps: 40         # the compression term reads the PATH; 6 steps scores an artefact
  solver_maxiter: 20000      # NOT 1500 — at the cap the design gradient is a function of the cap
  solver_tol: 1.0e-5
  backward_reg: 0.01
  updated_lagrangian: false

material:                    # inert under the surrogate (calibrate: false); kept for the ROM twin
  k_stretch: 96763.84
  k_shear:   51775.36
  k_rot:         1.1983
  density: 1.0

boundary_conditions:
  clamped_faces: [0]                            # ONE tile, bottom-left (col 0, row 0)

loads:                                          # DIAGONAL pull: pin 0 -> load 24
  - {face: 24, dof: 1, value: 1.0}  # ONE tile, top-RIGHT (col 4, row 4)

target:                      # fallback; run_closed overrides it with the rectangle above
  type: rectangle
  center: [2.5, 5.0]
  radius: 5.5

loss_weights:
  damage: 0
  ood: 0.001
  compression: 0
  chamfer: 50.0
  coverage: 0.0
  regularization: 1.0e-4

training:
  num_epochs: 200
  learning_rate: 0.01
  optimizer: adam
  lr_schedule: cosine
  grad_clip: 1.0
  geometric_loss_type: boundary_vertices

visualization:
  stage0: true
  stage1: false              # Stage 1 is BYPASSED (validity_method: none)
  stage2: true
  energy_plot: false         # ROM-only decomposition; meaningless under the surrogate
  animation: true
  show_plots: false
  save_outputs: true
  show_external_forces: false
  show_kinematic_blocks: true
