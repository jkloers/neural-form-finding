# Closed-state RDPQK — SQUARE 5x5 sheet, 25 panels, 40 hinges. ROM at a CALIBRATED 45 deg.
#
# PURPOSE: the VALIDITY LADDER figure. Same task for every rung -- match the target, subject to the
# flat sheet being a perfect closed cut pattern -- with only the validity mechanism varying.
#
# ── WHY SQUARE ────────────────────────────────────────────────────────────────────────────────
# spacing_y = spacing = 1.0 makes the tile square, so psi_x = psi_y = 45 deg and the two axes
# deploy IDENTICALLY: lam_max = sqrt(2) at theta = 90 deg, the classic rotating-squares result.
# The 3x3 parent has spacing_y = 2.0, giving psi_x = 63.43 and psi_y = 26.57 -- the short axis
# locks at 53.1 deg while the long one is still opening, which is correct but needs a paragraph to
# explain. A square sheet needs none, and 45 deg is exactly half of full deployment.
#
# ── PROVENANCE ────────────────────────────────────────────────────────────────────────────────
# Derived from the CURRENT BASELINE `sheet_4x8ft_pet_28deg.yaml`, NOT from the mis-posed 45 deg
# parent `sheet_4x8ft_rom.yaml`. Two things change, and only two:
#
#   1. `hinge_model.type: surrogate -> rom`.
#   2. `loads.value` RE-BISECTED for the ROM. The baseline's 2.50 N/tile is a SURROGATE
#      calibration; the ROM is a different hinge law and would badly under-deploy at that value.
#
# ★ THE TARGET RECTANGLE CARRIES OVER UNCHANGED, and this is not laziness. The target is derived
# from the mechanism kinematics, `lam(theta) = cos(psi - theta/2)/cos(psi)` with
# psi_x = 63.43 deg, psi_y = 26.57 deg — pure rigid-tile geometry, INDEPENDENT OF THE HINGE MODEL.
# Swapping the hinge law changes the load needed to reach 28 deg; it does not change the shape a
# 28 deg deployment has. Re-derive with `diagnostics/calibrate_target.py --angle 28` if the
# TESSELLATION changes.
#
# ── WHY THE ROM, AND NOT THE SURROGATE — two independent reasons ──────────────────────────────
#   1. STRUCTURAL. `build_surrogate_energy` derives per-hinge `alpha`/`sec_dir` from
#      `map_params['z']`/`['bnd_logits']` (nff/closed/setup.py:100-105), so a free-vertex chart has
#      no surrogate path at all — arms B-E could not run it.
#   2. DISTRIBUTIONAL. A torn or self-intersecting sheet is far outside the surrogate's training
#      distribution, so its energy would be meaningless even if it could be wired.
# The ROM is the physics HELD FIXED while only the chart varies: a control, never a yardstick.
# Nothing here claims the ROM is right about hinge mechanics, and no conclusion depends on it —
# a chart that tears the sheet is invalid under any hinge model.
#
# ⚠ NO DAMAGE UNDER THE ROM. `build_surrogate_energy` returns `(None,)*5`, so `loss_weights.damage`,
# `.ood`, `.compression`, `fail_line` and `learn_w_lig` are ALL INERT. They are written as 0/false
# here so the file does not imply otherwise.

tessellation:
  tessellation_type: closed_rdpqk
  M: 5
  N: 5
  r_init: 0.45
  spacing: 1.0
  spacing_y: 1.0             # SQUARE pitch -> psi_x = psi_y = 45 deg, isotropic deployment
  sheet_width_mm: 2032.0     # 5 panels x the 406.4 mm calibrated pitch. NOT 4 ft stock: the
                             # pitch is fixed by the spring calibration (material: below), so a
                             # 5x5 sheet is 2032 mm square. Changing length_scale would
                             # invalidate k_stretch/k_shear/k_rot, which were converted with it.
  hinge_margin: 0.13
  clamped_dofs: [0, 1, 2]    # ONE tile, fully restrained -- a net moment would otherwise spin
                             # the whole sheet as a rigid body
  # no y_pin: face 12 is clamped on all three DOF, which is what carries the net torque
  # ★ THE CIRCLE. r = 1450 mm = 3.5679 u.
  # ⚠ NOT the sheet's natural size, and that is the whole point. At full deployment the untrained
  # sheet's boundary spans 1413-1830 mm about its centroid, averaging 1636 mm. A circle at that
  # AVERAGE (1621 mm, the first choice here) asks the design only to flatten the oscillation --
  # it never has to grow or shrink the sheet, so the tile-resizing mechanism the chart exists to
  # provide is barely exercised. Measured: the design moved 220 mm and reached 4.7 mm error.
  # 1450 mm demands an 11% CONTRACTION as well, which can only come from resizing tiles.
  # Measured at the extreme: a 1150 mm target (-31%) moves the design 690 mm and pulls the radius
  # to 1212, but the sheet can no longer stay round (69.6 mm error, spread 0.090). 1450 sits
  # between: a real resizing demand that the chart can still meet.
  target_cx: 2.5
  target_cy: 2.5
  target_r: 3.5679

mapping:
  map_type: closed_les       # arm A. Arms B-E override this to `direct_vertices` in code.

optimization_weights:
  # Arm A is valid by construction, so Stage 1 is BYPASSED — correct for the closed chart, and NOT
  # transferable to a free-vertex chart. ⚠ Carrying this setting over to arms B/C is exactly the
  # error that produced the retracted "38x by tearing" result: it removed the chart AND Stage 1 in
  # one step. Arms D/E override this to `alternating_projection` via `arm_validity_cfg`.
  validity_method: none

hinge_model:
  type: rom                  # the linear-spring ligament; `material:` below is LIVE
  w_lig_mm: 18.0             # physical standard; drives the cut geometry and the DXF export
  length_scale: 406.4        # mm per pipeline unit = the real panel pitch
  energy_scale: 2.4606e-3    # 1 / length_scale -> `loads.value` is in newtons
  calibrate: false
  learn_w_lig: false         # inert under the ROM (which is exactly blind to w_lig); off for clarity

physics:
  # Tiles cannot interpenetrate. ⚠ `min_angle` / `cutoff_angle` are DEGREES — `_parse_physics_config`
  # multiplies by pi/180, so writing radians double-converts.
  # ⚠ LIMITATION, load-bearing for this study: the barrier acts on BONDED pairs only. Two tiles not
  # hinged to each other can still pass through, and the angle model cannot see it. That is why the
  # ablation keeps an INDEPENDENT geometric overlap audit rather than trusting the contact model.
  use_contact: true
  k_contact: 1000000.0
  min_angle: -2.0            # DEGREES; asymptote just below the closed state
  cutoff_angle: 0.0          # barrier is exactly zero for every OPEN hinge
  linearized_strains: true
  incremental: true
  num_load_steps: 24         # ⚠ 6 is too coarse to carry the sheet to full deployment
  solver_maxiter: 20000      # ⚠ 1500 stops on the ITERATION CAP and returns a silently wrong state
  solver_tol: 1.0e-5
  backward_reg: 0.01         # ridge on the IFT adjoint
  updated_lagrangian: false

material:                    # LIVE under the ROM. Physical values from the PET hinge campaign,
                             # t = 0.5 mm, w_lig = 18 mm, RVE half-disk r_win = 100 mm:
                             #   k_stretch 238.1 N/mm, k_shear 127.4 N/mm, k_rot 487 N.mm/rad
                             # converted to pipeline units by x length_scale (see the parent config).
                             # ⚠ k_rot is the BUCKLED SECANT at 20 deg, not the elastic tangent:
                             # 0.5 mm PET buckles immediately and the moment SATURATES.
  k_stretch: 96763.84        # = 238.1 N/mm
  k_shear:   51775.36        # = 127.4 N/mm
  k_rot:         1.1983      # = 487 N.mm/rad
  density: 1.0

boundary_conditions:
  clamped_faces: [12]        # the centre tile only. ⚠ the parser maps this to
                             # topology['bc_clamped']; writing 'clamped_faces' into topology AFTER
                             # parsing is silently ignored and leaves the previous clamp in place.

loads:                       # top edge (j = 2) pulled +y, distributed against the clamped bottom.
  # ★ CALIBRATED 2026-08-04 by `calibrate_target.py --angle 45 --criterion max` on the square sheet.
  # Measured untrained: theta max 45.03, mean 41.42, min 38.63, spread 6.41 deg.
  # Measured untrained at this load: theta max 27.98, mean 27.39, min 25.72, spread 2.25 deg — the
  # whole sheet opens together, so the max/mean criterion is nearly moot here (it is NOT moot for a
  # single-tile grip). Do NOT hand-pick this value; re-bisect if the springs or tessellation change.
  # ★ ONE MOMENT drives the whole sheet. Measured at M = 75: every one of the 40 hinges opens to
  # 89.58-89.82 deg, min/max = 1.00. A rigid-deployable kirigami is a ONE-DOF mechanism, so a
  # single moment moves every hinge in lockstep; a distributed edge load reached only 0.86-0.93
  # because it partly fights the deployment mode instead of driving it.
  # theta is LINEAR in M (~1.2 M over M = 40..100) since k_rot is a linear spring. ⚠ DO NOT RAISE:
  # at M = 100 the sheet passes 90 deg to 119.7 and its mean radius FALLS 1636 -> 1182 mm, the
  # rotating-squares pattern going over the top and re-closing. M = 75 is the maximum-expansion point.
  - {face: 13, dof: 2, value: 75.0}

target:                      # fallback TargetConfig; the driver builds its own from the block above
  type: circle
  center: [2.5, 2.5]
  radius: 3.5679

loss_weights:
  chamfer: 50.0
  # coverage = 0: with only 12 boundary vertices against a 23.5-unit perimeter the coverage term has
  # a hard floor no design can beat, and it actively fights precision. See the parent config.
  coverage: 0.0
  regularization: 1.0e-4     # ⚠ FORCED TO 0 by `arm_training_cfg` — it is sum(theta^2) over the RAW
                             # parameter tree, so it means different things in different charts and
                             # leaving it on would invalidate the ablation.
  damage: 0.0                # inert under the ROM (no damage model)
  ood: 0.0                   # inert under the ROM
  compression: 0.0           # inert under the ROM (no probe => term skipped whatever the weight)

training:
  num_epochs: 1000           # ⚠ 200 leaves the baselines barely moved (28 mm vs 107 mm at 1000)
  learning_rate: 0.01
  optimizer: adam
  lr_schedule: cosine
  grad_clip: 1.0
  geometric_loss_type: boundary_vertices

visualization:
  stage0: true
  stage1: false              # bypassed for arm A (validity_method: none) — the plot is empty
  stage2: true
  energy_plot: true          # valid here: this IS a ROM run, so the spring decomposition applies
  animation: true
  show_plots: false
  save_outputs: true
  show_external_forces: false
  show_kinematic_blocks: true
