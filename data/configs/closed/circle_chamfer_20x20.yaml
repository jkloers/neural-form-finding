# Closed-state RDPQK 20x20 — central 2x2 alternating-moment actuation, fixed circle + chamfer.
# Face index = col*N + row (N=20). Central 2x2: BL=(9,9)=189 BR=(10,9)=209 TL=(9,10)=190 TR=(10,10)=210.
# Clamp BL(189); moments BR(209)+ TL(190)+ TR(210)- . Bigger moment (more panels to actuate).

tessellation:
  tessellation_type: closed_rdpqk
  M: 20
  N: 20
  r_init: 0.45
  spacing: 1.0
  hinge_margin: 0.13

mapping:
  map_type: closed_les

optimization_weights:
  validity_method: none

physics:
  use_contact: false
  linearized_strains: true
  incremental: true
  num_load_steps: 15
  solver_maxiter: 1500
  solver_tol: 1.0e-5
  updated_lagrangian: false

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [189]

loads:
  - face: 209
    dof: 2
    value: 40.0
  - face: 190
    dof: 2
    value: 40.0
  - face: 210
    dof: 2
    value: -40.0

target:
  type: circle
  center: [10.0, 10.0]
  radius: 10.0

loss_weights:
  chamfer: 1.0
  coverage: 0.5
  stretching: 0.1
  shearing: 0.1
  bending: 0.0
  contact: 0.0
  material_area: 0.0
  hinge_gap: 0.0
  openness: 0.0
  deformation: 0.0
  void_closure: 0.0
  closure_delta: 0.0
  regularization: 1.0e-4

training:
  num_epochs: 120
  learning_rate: 0.02
  optimizer: adam
  lr_schedule: cosine
  grad_clip: 1.0
  geometric_loss_type: boundary_vertices

visualization:
  stage0: true
  stage1: false
  stage2: true
  energy_plot: true
  animation: false
  show_plots: false
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_face_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
