# Closed-state RDPQK kirigami — 2x2 ROTATING-SQUARES EXPANSION demonstrator.
#
# Smallest useful closed sheet: 2x2 tiles (cut grid 3x3, 4 hinges). Physical scale =
# 10 * w_lig_mm / spacing = 100 mm/tile -> ~200x200 mm flat coupon (10 mm ligaments). Well inside a
# QUARTER of the lab bed (bed ~84x54 cm; a quarter ~42x27 cm) and a robust size for a first laser cut.
#
# Actuation = the AUXETIC EXPANSION mode: the 4 tiles COUNTER-ROTATE in a checkerboard sign pattern
# (-M on faces 0,3 ; +M on faces 1,2), with one tile's translation pinned to remove rigid-body drift.
# This opens the voids and GROWS the footprint (rotating-squares auxetic): area scales with the
# opening angle, peaking near +-45deg. TARGET DEPLOYMENT = ~30deg. With this config (w_lig 10mm)
# the moment->angle map is: M=0.5 -> ~29deg (chosen), M=0.7 -> 40deg, M=1.0 -> 57deg. Training with a
# SNUG target (target_radius_scale 1.0) does not drift the angle (trained == untrained).
#
# HINGE MODEL = elastic ROM. The steel surrogate CANNOT do this: every hinge rotates ~45deg, far past
# steel's ~0.6deg yield / few-degree fracture limit (all 4 hinges fracture). Steel physically cannot
# perform a large rotating-squares deployment; the elastic ROM represents a compliant hinge and shows
# the geometric expansion. (For the steel limit, see circle_2x2_surrogate.yaml: ~6deg then snap.)
#
# Face index = col * N + row  (row 0 = bottom). For N=2:
#   bottom row (row 0): 0, 2      top row (row 1): 1, 3
#   checkerboard parity (col+row): faces 0,3 = even ; faces 1,2 = odd

tessellation:
  tessellation_type: closed_rdpqk
  M: 2
  N: 2
  r_init: 0.45
  spacing: 1.0
  target_radius_scale: 1.0          # snug to the 30deg deploy (was too big before)

mapping:
  map_type: closed_les

optimization_weights:
  validity_method: none             # bypass Stage 1 (LES output is already valid)

# Elastic ROM hinges (linear spring). w_lig_mm still sets the cut-pattern / DXF physical scale.
hinge_model:
  type: rom                         # rom | surrogate
  w_lig_mm: 10.0                    # manufacturing choice -> 100 mm/tile, ~200x200 mm sheet
  fillet_ratio: 0.16

physics:
  use_contact: false
  linearized_strains: true
  incremental: true
  num_load_steps: 12
  solver_maxiter: 1000
  solver_tol: 1.0e-5
  updated_lagrangian: false

material:
  k_stretch: 1000.0                 # stiff ligaments — keep hinges connected
  k_shear: 1000.0
  k_rot: 0.5                        # soft rotation — easy deployment
  density: 1.0

boundary_conditions:
  clamped_faces: [0]                # pin ONE tile's translation only (free to rotate)
  clamped_dofs: [0, 1]              # x + y (NOT rotation) -> removes rigid-body drift, allows the mode

loads:                              # checkerboard counter-rotating moments (expansion mode) -> ~30deg
  - {face: 0, dof: 2, value: -0.5}
  - {face: 3, dof: 2, value: -0.5}
  - {face: 1, dof: 2, value:  0.5}
  - {face: 2, dof: 2, value:  0.5}

target:
  type: circle
  center: [1.0, 1.0]
  radius: 1.5

loss_weights:
  chamfer: 1.0
  coverage: 0.5
  stretching: 0.01
  shearing: 0.01
  bending: 0.001
  contact: 0.0
  material_area: 0.0
  hinge_gap: 0.0
  openness: 0.0
  deformation: 0.0
  void_closure: 0.0
  closure_delta: 0.0
  regularization: 1.0e-4

training:
  num_epochs: 80
  learning_rate: 0.02
  optimizer: adam
  lr_schedule: cosine
  grad_clip: 1.0
  geometric_loss_type: boundary_vertices

visualization:
  stage0: false
  stage1: false
  stage2: false
  energy_plot: false
  animation: false
  show_plots: false
  save_outputs: false
