# Closed-state RDPQK 10x10 — central 2x2 block actuation.
#
# Take the four central tiles; clamp one and drive the other three with moments
# in ALTERNATING directions (checkerboard) to open the tessellation.
#
# Face index = col*N + row (N=10). Central 2x2 block:
#   BL=(4,4)=44  BR=(5,4)=54  TL=(4,5)=45  TR=(5,5)=55
# Clamp BL(44); moments: BR(54)+, TL(45)+, TR(55)-  (TR is same checkerboard
# class as the clamped BL, so it rotates opposite -> opening mode).

tessellation:
  tessellation_type: closed_rdpqk
  M: 10
  N: 10
  r_init: 0.45
  spacing: 1.0
  hinge_margin: 0.13
  radial_boundary: true
  radial_max: 0.9

mapping:
  map_type: closed_les

optimization_weights:
  validity_method: none

physics:
  use_contact: false
  linearized_strains: true
  incremental: true
  num_load_steps: 15
  solver_maxiter: 1500
  solver_tol: 1.0e-5
  updated_lagrangian: false

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [44]              # one central tile clamped

loads:
  - face: 54                       # BR — +moment
    dof: 2
    value: 35.0
  - face: 45                       # TL — +moment
    dof: 2
    value: 35.0
  - face: 55                       # TR — -moment (alternating)
    dof: 2
    value: -35.0

target:
  type: circle
  center: [5.0, 5.0]
  radius: 5.0

loss_weights:
  chamfer: 1.0
  coverage: 0.5
  stretching: 0.1
  shearing: 0.1
  bending: 0.0
  contact: 0.0
  material_area: 0.0
  hinge_gap: 0.0
  openness: 0.0
  deformation: 0.0
  void_closure: 0.0
  closure_delta: 0.0
  regularization: 1.0e-4

training:
  num_epochs: 150
  learning_rate: 0.02
  optimizer: adam
  lr_schedule: cosine
  grad_clip: 1.0
  geometric_loss_type: boundary_vertices

visualization:
  stage0: true
  stage1: false
  stage2: true
  energy_plot: true
  animation: false                 # redundant with training_evolution.gif
  show_plots: false
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_face_indices: false
  show_external_forces: true       # draw moment arrows
  show_kinematic_blocks: true      # draw clamped tile (gray)
