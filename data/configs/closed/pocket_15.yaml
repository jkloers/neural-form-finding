# Closed-state RDPQK -- SQUARE 15x15 sheet, 225 panels, 420 hinges. ROM.
#
# PURPOSE: the FORCE POCKET study, middle rung of the domain ladder 11 -> 15 -> 21.
# ★ RATIONALE FOR EVERY CHOICE HERE IS IN `pocket_11.yaml` -- read that banner first. The three
# files differ ONLY in M, N, sheet_width_mm, the target centre, and the background moment.
# Centre tile = col 7, row 7 = face 112 (face id = col * N + row).

tessellation:
  tessellation_type: closed_rdpqk
  M: 15
  N: 15
  r_init: 0.5
  spacing: 1.0
  spacing_y: 1.0
  sheet_width_mm: 6096.0     # 15 panels x the 406.4 mm calibrated pitch
  hinge_margin: 0.13
  init_noise: 0.0
  init_seed: 0
  target_cx: 7.5
  target_cy: 7.5
  target_r: 8.0

mapping:
  map_type: closed_les

optimization_weights:
  validity_method: none

hinge_model:
  type: rom
  w_lig_mm: 18.0
  length_scale: 406.4
  energy_scale: 2.4606e-3
  calibrate: false
  learn_w_lig: false

physics:
  use_contact: true
  k_contact: 1000000.0
  min_angle: -2.0
  cutoff_angle: 0.0
  linearized_strains: true
  incremental: true
  num_load_steps: 24
  solver_maxiter: 20000
  solver_tol: 1.0e-8         # ★ absolute tolerance, and the pocket is a DIFFERENCE. See pocket_11.
  backward_reg: 0.01
  updated_lagrangian: false

material:
  k_stretch: 96763.84
  k_shear:   51775.36
  k_rot:         1.1983
  density: 1.0

boundary_conditions:
  clamped_faces: [0]         # corner tile, all three DOFs. The GAUGE, not a support.

loads:
  # ⚠⚠ COMPARISON ARM ONLY -- see the long banner in `pocket_11.yaml`. The default background is
  # `--bg-mode checkerboard`, built in the driver, because a point actuator puts a stress
  # concentration into every difference. Reached with `--bg-mode point`.
  - {face: 1, dof: 2, value: 392.0}

target:
  type: circle
  center: [7.5, 7.5]
  radius: 8.0

loss_weights:
  chamfer: 0.0

training:
  num_epochs: 0
  learning_rate: 0.0
  optimizer: adam

visualization:
  save_outputs: false
  show_plots: false
