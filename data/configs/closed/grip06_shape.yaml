# ── 10-GRIP COMPRESSION STUDY, sub-problem 06 / arm "shape" ───────────────────────────────
# Generated by tmp/make_grips.py (seed 7). Everything below is IDENTICAL across the 20 configs
# except the grip and the `compression` weight, so the average over sub-problems isolates the
# penalty rather than any one load path.
#
#   CLAMP   face 51  (col 5, row 1)   pinned in x,y — rotation FREE
#   LOAD    face 148  (col 14, row 8)   517.40 N at +37.9 deg from +x
#   ROLLER  face 9  (x-roller)        pinned in x only
#
# ★ WHY A ROLLER AT ALL, when the brief said ONE clamped tile. A lone pin with rotation free is
# SINGULAR: the strain energy is corotated, so a rigid rotation of the whole assembly about the pin
# costs exactly zero and a force-controlled solve has nothing to resist it. Measured previously on
# this sheet: it swung +11.2 deg bodily and chamfer plateaued 8.9x worse. The roller pins ONE
# translation DOF on a second tile and clamps nothing — both tiles keep their own rotation — so
# "one clamped tile" still holds.
# ★ ROLLER AXIS IS DERIVED, not chosen: a rigid rotation about the pin moves the roller tile
# perpendicular to the pin->roller vector, so the restrained component is the one that motion is
# dominated by. Here d = (dx -5.0, dy +8.0) -> x-roller.
# ★ LOAD DIRECTION follows clamp->load. A fixed +x pull would COMPRESS the sheet for any grip whose
# clamp lies to the +x side of the loaded tile. Magnitude is held at 517.40 N for every grip.
# ⚠ CONSEQUENCE OF THE FIXED LOAD: each grip reaches its OWN deployment angle. theta_max is NOT
# equalised across sub-problems, so part of the spread between them is calibration rather than
# load-path physics. Report the measured theta spread alongside any averaged result.
# ★ TARGET is auto-fit per grip (bbox of THIS grip's untrained deploy, anchored at its clamp,
# scaled 0.99) rather than a rectangle fixed in absolute coordinates — the clamp anchors the
# sheet, so an absolute rectangle is unreachable for a grip pinned somewhere else.

tessellation:
  tessellation_type: closed_rdpqk
  M: 15
  N: 10
  r_init: 0.45
  spacing: 1.0
  spacing_y: 1.0             # ★ SQUARE tiles -> psi = 45 deg -> 90 deg / sqrt(2). See banner.
  sheet_width_mm: 6096.0     # = M * spacing * length_scale = 15 * 406.4
  hinge_margin: 0.13
  target_radius_scale: 0.99

  # ── SUPPORTS: a PIN and a ROLLER, which is one clamped tile with its rotation free ────────────
  # Face id = col * N + row, verified against the built tessellation: face 0 = bottom-left,
  # face 140 = bottom-right, face 9 = top-left, face 79 = top-centre, face 149 = top-right.
  #
  # `clamped_dofs: [0, 1]` pins x and y at the clamped tile but leaves its ROTATION FREE, as
  # specified. On its own that is SINGULAR: the strain energy is corotated, so a rigid rotation of
  # the whole assembly about the pin costs exactly zero, and a force-controlled solve has nothing to
  # resist it. `project_single_tile_grip_family` measured this failure — the sheet SWUNG +11.2 deg
  # bodily, tilting -12.1 deg against an axis-aligned target, and chamfer plateaued 8.9x worse,
  # because no design can cancel a rigid-body rotation.
  #
  # The fix is the second support, and pin + roller is the textbook statically-determinate pair:
  # rotating about face 9 would move face 0 in x, which the x-roller forbids. Both tiles keep their
  # own rotational DOF, so "rotation allowed" holds where it was asked for.
  #
  # ★ Roller PLACEMENT follows the measured rule: the support-side tile FARTHEST from the clamp —
  # the long lever arm restrains the swing while carrying least load. The clamp is face 9 (TOP-left),
  # so the far LEFT-EDGE tile is face 0 (bottom-left), 9 rows away.
  #
  # ★ Roller DIRECTION is x here, and it is x for a GEOMETRIC reason. Face 0 sits directly below
  # face 9 (offset purely in -y), so a small rigid rotation about the pin moves it along +-x. Only an
  # x restraint has any lever on that mode; a y-roller there would be nearly parallel to the motion
  # it is supposed to block. The x-roller also leaves face 0 free to slide in y, so the sheet still
  # expands vertically.
  # ⚠ The grip family recorded an x-roller as the WRONG restraint, but that verdict came from the
  # 1x2 sheet's anisotropy (lam_x 1.48 vs lam_y 1.10) under a +y pull. SQUARE tiles remove the
  # anisotropy (lam_x = lam_y) and this grip pulls +x, so neither half of that reasoning transfers.
  # ★ MEASURED for THIS grip at 200 N (SWING = mean face rotation; a NET rotation is the rigid mode,
  # the counter-rotating deployment mode averages ~0):
  #     roller        theta_max  spread   SWING     deployed w x h
  #     none            70.73     1.18   +36.54 deg   24.26 x 22.10
  #     x_roller [0]    67.36     1.83    +3.79 deg   20.83 x 13.96   <- USE THIS
  #     y_roller [0]    67.06     2.85   +46.49 deg   23.80 x 23.35   <- WORSE THAN NO ROLLER
  # The y-roller does not merely underperform, it fails: nearly parallel to the motion it must
  # block, it leaves the swing free and the sheet balloons. 10x separation, so this is not a
  # close call.
  clamped_dofs: [0, 1]       # PIN at the clamped tile: x, y fixed; rotation FREE
  x_roller_faces: [9]        # ROLLER at the far LEFT corner: x only, slides in y. See below.

  # ── TARGET, CALIBRATED 2026-08-03 — theta_deploy 80 deg, target sized at 75 deg ───────────────
  #   PYTHONPATH=$(pwd) JAX_PLATFORMS=cpu conda run -n kgnn_mac python \
  #     nff/scripts/diagnostics/calibrate_target.py --config <this file> \
  #     --angle 80 --shape-angle 75 --steps 6
  #
  # ★ WHY 80 AND NOT 90. 90 deg is the ASYMPTOTE (theta = 2*psi), where lam is maximal and the
  # load-angle curve saturates onto it, so no finite load reaches it. Measured saturation sweep:
  #     111 N -> 44.8 deg (area 1.71) | 443 -> 73.3 (1.97) | 1107 -> 83.1 (2.02) | 3320 -> 89.4 (2.04)
  #    11066 N -> theta_min COLLAPSES to 0.02 with an 86 deg spread, lam_y 1.50 > sqrt(2)
  #    55330 N -> theta_max 104 deg, past the lock: hinges rotating THROUGH each other. Unphysical.
  # So the usable ceiling is ~3 kN and the solve degenerates beyond it.
  # ★ The AREA GOAL IS STILL MET: at 80 deg the measured lam is 1.4115 / 1.4205, i.e. AREA RATIO
  # 2.005 — the sheet reaches the theoretical rotating-squares maximum (sqrt(2) per direction)
  # BEFORE the 90 deg kinematic limit, because the tile corners swing outside the panel pitch.
  # Chasing the last 10 deg buys 1.5% of area and costs a 4x load and a broken solve.
  #
  # ⚠ HEADROOM IS INHERENTLY SMALL HERE, and this is a property of the mechanism, not a mis-setting.
  # lam(theta) = cos(psi - theta/2)/cos(psi) is FLAT near full deployment (dlam/dtheta -> 0 at
  # theta = 2*psi), so dropping the shape angle 80 -> 75 moves the target only +0.7% in x / +1.3%
  # in y. Sizing at 65 deg would still buy only ~2-3%. Near maximum deployment the SHAPE is very
  # nearly forced by the kinematics, and what remains free is HOW THE LOAD GETS THERE — which is
  # precisely the variable this experiment studies. Read a small chamfer improvement accordingly:
  # it is the problem being load-path-limited rather than the optimizer failing.
  #
  # Measured at the calibrated load: flat 15.0000 x 10.0000 u -> deployed 21.1720 x 14.2045 u.
  # Anchored with its bottom edge ON the deployed bottom edge: the supported tiles cannot leave it,
  # so a target floating above or below would put them permanently outside and make that chamfer
  # error unfixable.

mapping:
  map_type: closed_les

optimization_weights:
  validity_method: none

hinge_model:
  # Under `type: rom`, build_surrogate_energy returns (None,)*5 before reading `checkpoint` /
  # `material` / `thickness_mm`, so those three are INERT and describe a checkpoint, not this run.
  #
  # ★ WHY THE ROM AND NOT THE SURROGATE, at 90 deg. The PET FEA campaign's database ceiling is
  # 45 deg and the v3 checkpoint's trust box tops out at 71.9 deg. A 90-deg deployment is therefore
  # PURE EXTRAPOLATION for the surrogate — it would be reporting physics it never saw. Under the ROM
  # the quantity this experiment measures (hinge axial compression, eta_a = a / w_lig) is a
  # KINEMATIC fact read off the corotated local hinge frame, not a model prediction. That is the
  # right instrument for this question. The ROM's known defect — a quadratic k_rot cannot saturate —
  # is not load-bearing here, because nothing in this experiment claims a hinge FORCE magnitude.
  type: rom
  checkpoint: data/surrogates/hinge_surrogate_v2.pkl   # inert under rom
  material: S235                                       # inert; the CHECKPOINT's material
  thickness_mm: 0.5
  w_lig_mm: 18.0             # LIVE: drives cut geometry, the DXF export, and eta_a = a / w_lig
  calibrate: false
  length_scale: 406.4        # mm per pipeline unit = the real panel pitch (held, see banner)
  energy_scale: 2.4606e-3    # 1 / length_scale -> loads.value is newtons
  barrier: 0.05
  fail_line: 1.0
  learn_w_lig: false         # ⚠ EXACTLY INERT under the ROM (the springs are blind to w_lig).
                             # Set false rather than true so the config does not imply otherwise.

physics:
  # Contact block inherited verbatim from sheet_4x8ft_rom.yaml — tiles cannot interpenetrate.
  # ⚠ min_angle / cutoff_angle are DEGREES (_parse_physics_config converts).
  # This matters MORE here than at 45 deg: near full deployment the tiles swing toward collinearity
  # and neighbours close on each other, so contact is what stops the sheet folding through itself.
  use_contact: true
  k_contact: 1000000.0
  min_angle: -2.0            # DEGREES
  cutoff_angle: 0.0
  linearized_strains: true
  incremental: true
  # ★★ 40, NOT 6 — MEASURED 2026-08-03, and 6 would have corrupted the compression experiment.
  # Incremental loading solves a SEQUENCE of equilibria, so the path BETWEEN them depends on the
  # stepping. The endpoint does not care (theta_max = 80.00 deg at every resolution below) but the
  # compression penalty reads the PATH, and it moves a lot:
  #     steps      hard min eta_a   soft min   PENALTY value   % compressive samples
  #        6          -0.1051       -0.0651      2.012e-04            34.8
  #       12          -0.0703       -0.0340      8.340e-05            33.8
  #       20          -0.0831       -0.0372      7.129e-05            33.1
  #       40          -0.0603       -0.0290      5.158e-05            32.7
  #       80          -0.0475       -0.0287      4.824e-05            32.7
  # At 6 steps the penalty is 4.2x its converged value: the coarse solve OVERSHOOTS between
  # equilibria and the term scores that artifact rather than the physics. It converges by 40
  # (within 7% of 80). Cost is ~6.7x a 6-step run, which at ~0.4 s/epoch is affordable.
  # ⚠ Note what is and is not robust: the EXTREME (min eta_a) is resolution-sensitive, the
  # POPULATION measure (% of compressive samples) is stable to ~2 pts everywhere. Prefer the
  # population measure when reporting, and never compare a min eta_a across step counts.
  num_load_steps: 40
  solver_maxiter: 20000      # ★★★ 20000, NOT 1500 — MEASURED 2026-08-03. At 1500 the Stage-2
                             # L-BFGS stops on the ITERATION CAP, so the returned state is a
                             # function of the iteration count and jumps discontinuously with
                             # the design: d(compression)/d(design) disagreed with central FD
                             # by 122x. At 20000 it agrees to 1% at 40 load steps and is stable
                             # across solver_tol 1e-5..1e-9. Chamfer was insensitive (it is a
                             # coarse geometric measure), which is why this hid for so long.
  solver_tol: 1.0e-5
  backward_reg: 1.0e-6       # MEASURED 2026-08-03: the ROM Hessian here is POSITIVE DEFINITE
                             # (lam_min +17.9, cond 4.25e4), so no ridge is needed. At 0.01 the
                             # ridge biased d(compression)/d(design) by 3.7%; at 1e-6 the
                             # analytic gradient matches central FD to 0.1%. Do NOT copy this
                             # value to a surrogate config -- plastic softening makes H
                             # indefinite there and the ridge is load-bearing.
  updated_lagrangian: false

material:                    # LIVE under the ROM. Inherited unchanged — see sheet_4x8ft_rom.yaml
                             # for the full derivation. PET t = 0.5 mm, w_lig = 18 mm, r_win = 100 mm:
                             #   k_stretch 238.1 N/mm, k_shear 127.4 N/mm, k_rot 487 N.mm/rad
                             # converted at length_scale = 406.4, energy_scale = 1/length_scale.
  k_stretch: 96763.84        # = 238.1 N/mm
  k_shear:   51775.36        # = 127.4 N/mm
  k_rot:         1.1983      # = 487 N.mm/rad (the BUCKLED SECANT at 20 deg, not the elastic tangent)
  density: 1.0

boundary_conditions:
  clamped_faces: [51]         # ONE tile on the LEFT edge (col 0, row 9 = top-left). Pinned x+y.

loads:                       # ONE tile on the RIGHT edge (col 14, row 0 = bottom-right), pulled +x
                             # against the left-edge supports. Clamp LEFT, pull RIGHT — so the load
                             # must cross the full 15-tile span, and because the pin is top-left
                             # while the load is bottom-right the path runs DIAGONALLY across the
                             # sheet. That is the interesting case for isostatics: a straight
                             # left-to-right pull would be too symmetric to reveal much.
                             # ★ 517.40 N PUTS THE WORST HINGE AT 79.97 deg (calibrate_target.py
                             # --angle 80 --shape-angle 75, bisecting on theta_MAX: the angle is a
                             # ceiling the mechanism imposes, not a value every hinge must reach).
                             # Measured: max 79.97, mean 78.57, min 77.59, spread 2.38 deg,
                             # deployed 21.1882 x 14.2065 u -> lam 1.4125 / 1.4207 -> AREA 2.007.
                             # ⚠ Recalibrated for the clamp-9 / pull-140 grip; the previous 775.54 N
                             # belonged to the bottom-clamp / top-centre-pull arrangement.
                             #
                             # ⚠ THE SHEET OPENS ALMOST UNIFORMLY DESPITE THE SINGLE-TILE GRIP —
                             # spread 2.65 deg across 275 hinges, against the 12-20 deg spreads the
                             # 3x3 grip family showed at 15-20 deg deployment. This is the kinematic
                             # lock homogenising the sheet: near theta = 2*psi every hinge piles up
                             # against the same limit, so a concentrated grip cannot keep a
                             # concentrated ANGLE field. Measured spread vs load: 21.7 deg at 79 N,
                             # 2.06 at 264 N, 2.65 at 776 N. It is the FORCE field, not the angle
                             # field, that stays concentrated — which is why this experiment reads
                             # load paths and not rotations.
                             #
                             # ⚠ 517 N through ONE 406 mm tile of 0.5 mm PET is far past what the
                             # real material would survive. The ROM cannot see that: linear springs
                             # do not yield (see the history note in sheet_4x8ft_rom.yaml). This is a
                             # kinematics-and-load-path study, not a strength prediction, and no
                             # claim here depends on the force magnitude being physical.
  - {face: 148, dof: 0, value: 408.4108}
  - {face: 148, dof: 1, value: 317.6529}

target:                      # fallback TargetConfig; run_closed overrides it with the rectangle above
  type: rectangle
  center: [10.3108, 3.0738]
  radius: 10.5159

loss_weights:
  chamfer: 50.0
  # coverage = 0. This sheet has few boundary vertices against a long perimeter, so the coverage
  # term has a hard floor no design can beat and it actively fights precision (measured on the 3x3:
  # boundary error 18.3 -> 29.5 mm, deployment angle dragged 45 -> 62.7 deg). At 0, chamfer_total IS
  # the precision term and reads cleanly.
  coverage: 0.0
  # ── PATH PENALTIES: the two axes of the (eta_a, eta_s) hinge-strain plane ────────────────────
  # Both LIVE under the ROM via the kinematic probe (nff/closed/setup.py::build_rom_probe_fn) —
  # eta_a = a/w_lig and eta_s = s/w_lig come off the corotated hinge frame, so neither is a
  # surrogate prediction. `compression` pushes the path cloud off eta_a < 0; `shear_path` squeezes
  # it toward eta_s = 0. Both take a soft path extremum (temperature scaled to each path's own
  # range) and a LINEAR penalty.
  #
  # ⚠ `shear_path` is NOT `shearing`. `shearing` weights the global ligament shear ENERGY and is 0
  # here; `shear_path` weights the per-hinge kinematic |eta_s| along the deployment path.
  #
  # ★★ WEIGHTS ARE MEASURED GRADIENT PARITY WITH chamfer(w=50) AT THE UNTRAINED START, 2026-08-04,
  # by full design-gradient NORM. At theta_deploy 80 deg, 40 load steps:
  #     chamfer      w=50   |grad| 5.342e+01
  #     compression  w=1    |grad| 3.403e-03   ->  parity 1.5696e4
  #     shear_path   w=1    |grad| 6.427e-03   ->  parity 8.3113e3
  # ⚠ These SUPERSEDE the 1.16e4 used by sheet_15x10_rom_compP116E4.yaml, which came from a single
  # d/dz coordinate rather than the gradient norm. Same order, but only the norm-based numbers are
  # comparable across terms, so the whole 4-arm matrix uses them.
  # ⚠ The 70-deg fork has its OWN parity (compression 2.9643e4 / shear_path 1.5766e4). Do not mix.
  #
  # THIS FILE: COMPRESSION arm: eta_a only.
  compression: 0
  shear_path: 0
  regularization: 1.0e-4

training:
  num_epochs: 200
  learning_rate: 0.01
  optimizer: adam
  lr_schedule: cosine
  grad_clip: 1.0
  geometric_loss_type: boundary_vertices

visualization:
  stage0: false
  stage1: false              # Stage 1 is BYPASSED (validity_method: none) — the plot would be empty
  stage2: false
  energy_plot: false          # valid under the ROM (the decomposition IS the linear-spring one)
  animation: false
  show_plots: false
  save_outputs: true
  show_external_forces: false
  show_kinematic_blocks: false
