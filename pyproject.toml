[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-form-finding"
version = "0.2.0"
description = "Differentiable inverse design of closed kirigami sheets: cut pattern -> physics deployment -> target shape, with a learned CalculiX hinge-energy surrogate."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "shapely",
    "pyyaml",
    "pillow",
    "jax",
    "jaxlib",
    "jax-md",
    "optax",
    "jaxopt",
    "equinox",
    "jaxtyping",
]

[project.optional-dependencies]
# Cut-file export and the CalculiX hinge oracle's meshing.
fabrication = ["ezdxf", "gmsh"]
# The archived GNN pipeline in legacy/gnn (run it from tag pre-cleanup-2026-11).
legacy = ["jraph", "flax"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nff*", "nff_paper*"]

[tool.setuptools.package-dir]
"" = "."

[project.scripts]
nff-closed = "nff.scripts.run_closed:main"
nff-train-surrogate = "nff.scripts.train_hinge_surrogate:main"
nff-hinge-dataset = "nff.scripts.generate_hinge_dataset:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `test_*.py` only: diagnostics such as taylor_test.py are scripts, not test modules.
python_files = ["test_*.py"]
