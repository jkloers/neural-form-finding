# EGNN v6 — better gradient flow to Stage 0 + stronger chamfer signal
# Key changes vs v5:
#   - anchoring: 300→600 — Stage 1 moves less from Stage 0; stronger IFT gradient back to GNN.
#     v5 had anchoring=300: Stage 1 rearranged faces too aggressively, Stage 0 stopped learning
#     precise boundary positions (gradient "disconnected"). 600 allows Stage 1 to close hinges
#     (connectivity=3000 >> anchoring=600, ratio 5:1) while keeping Stage 0 gradient intact.
#   - chamfer: 2000→4000 — push Stage 0 to produce tighter circle boundary fit.
#   - hinge_gap: 300→400 — slightly stronger Stage 0 hinge closure incentive.
#   - material_area: 50→100 — stronger area preservation.
#   - face_area in validity: 10→5 — slightly less rigidity on face sizes.
#   - num_epochs: 500→1000 — training was still noisy at ep 500; more time to converge.
#   - seed: 2 (best seed from v3 experiments)

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1

mapping:
  map_type: gnn_egnn
  domain_restriction: 1
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 64
    num_layers: 4
    seed: 2

optimization_weights:
  connectivity: 3000.0
  non_intersection: 0
  target: 0
  arm_symmetry: 0
  void_length: 500.0
  void_collinear: 500.0
  boundary_rigidity: 0
  face_area: 5.0
  anchoring: 600

physics:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 10
  solver_maxiter: 1000
  solver_tol: 1e-5

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [0]

loads:
  - face: [14]
    dof: 2
    value: -4.0

training:
  num_epochs: 1000
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"
  save_plots: true
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 4000.0
  material_area: 100.0
  stretching: 1
  shearing: 10
  bending: 0
  contact: 1
  regularization: 0.0001
  coverage: 1.0
  hinge_gap: 400.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: true
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
