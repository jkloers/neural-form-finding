# EGNN v7 — Stage 1 also fits circle boundary (target_fitting in validity)
# Key changes vs v5:
#   - target: 0→200 in optimization_weights: Stage 1 now minimizes Chamfer distance
#     to the circle boundary in addition to closing hinges. This fixes v5's main issue:
#     Stage 1 was closing hinges but rearranging boundary faces away from the circle,
#     worsening chamfer (0.030 vs v3_s2's 0.020). Adding target_fitting=200 makes
#     Stage 1 find configurations that are simultaneously hinge-closed AND circle-fitting.
#   - chamfer: 2000 (reverted from v6's 4000 — doubling caused gradient explosions)
#   - material_area: 50→100 (keep v6's improved value)
#   - hinge_gap: 300→400 (keep v6's slight increase)
#   - anchoring: 300 (same as v5, not v6's 600 — v5's anchor gave better Stage 1 closure)
#   - num_epochs: 500 (back to 500 — v6's instability showed 1000 not necessary)
#   - seed: 2

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1

mapping:
  map_type: gnn_egnn
  domain_restriction: 1
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 64
    num_layers: 4
    seed: 2

optimization_weights:
  connectivity: 3000.0
  non_intersection: 0
  target: 200.0
  arm_symmetry: 0
  void_length: 500.0
  void_collinear: 500.0
  boundary_rigidity: 0
  face_area: 5.0
  anchoring: 300

physics:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 10
  solver_maxiter: 1000
  solver_tol: 1e-5

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [0]

loads:
  - face: [14]
    dof: 2
    value: -4.0

training:
  num_epochs: 500
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"
  save_plots: true
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 2000.0
  material_area: 100.0
  stretching: 1
  shearing: 10
  bending: 0
  contact: 1
  regularization: 0.0001
  coverage: 1.0
  hinge_gap: 400.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: true
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
