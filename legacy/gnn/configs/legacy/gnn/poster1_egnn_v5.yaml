# EGNN v5 — full Jacobian (reverted from v4) + aggressive validity weights
# Key changes vs v3_s2:
#   - Reverts det-normalization: uses full Jacobian F (same as v3_s2, best chamfer).
#   - connectivity: 100→3000 (was 20x weaker than anchoring; now 10x stronger)
#   - anchoring: 2000→300 (freed up so Stage 1 can actually move faces to close hinges)
#   - void_length: 1→500, void_collinear: 1→500 (enforce parallelogram voids)
#   - face_area: 1→10 (stronger resistance to face degeneration)
#   - seed: 2 (best seed from v3 experiments)
#
# Diagnosis: in v3_s2 the L-BFGS ran with anchoring=2000 >> connectivity=100,
#   so the solver stayed within ~0.01 of Stage 0 output and could not close hinges.
#   New ratio: connectivity/anchoring = 10:1 → hinge closure dominates.

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1

mapping:
  map_type: gnn_egnn
  domain_restriction: 1
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 64
    num_layers: 4
    seed: 2

optimization_weights:
  connectivity: 3000.0
  non_intersection: 0
  target: 0
  arm_symmetry: 0
  void_length: 500.0
  void_collinear: 500.0
  boundary_rigidity: 0
  face_area: 10.0
  anchoring: 300

physics:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 10
  solver_maxiter: 1000
  solver_tol: 1e-5

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [0]

loads:
  - face: [14]
    dof: 2
    value: -4.0

training:
  num_epochs: 500
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"
  save_plots: true
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 2000.0
  material_area: 50.0
  stretching: 1
  shearing: 10
  bending: 0
  contact: 1
  regularization: 0.0001
  coverage: 1.0
  hinge_gap: 300.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: true
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
