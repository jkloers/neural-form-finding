# EGNN v3 — Jacobian-based CNV transformation + tuned weights
# Key changes vs v2:
#   - apply_gnn_mapping now uses per-face Jacobian of centroid movement for CNV transform,
#     the same geometry as the polynomial approach. GNN scale/theta provide fine-tuning.
#     This fixes the 47% area shrinkage seen in v2 where Stage 1 had to compress faces heavily.
#   - phi_x init reverted to 0.01 (0.05 caused gradient spikes at epoch 0-10)
#   - material_area: 50.0 (reinforce area preservation now that Jacobian is doing the heavy lifting)
#   - face_area: 1.0 in validity weights (tells Stage 1 to resist shrinking faces)
#   - hinge_gap: 300 (between v1=100 and v2=500; v2 was too noisy)
#   - anchoring: 2000 (back to original; Jacobian makes Stage 1's job easier)

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1

mapping:
  map_type: gnn_egnn
  domain_restriction: 1
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 64
    num_layers: 4
    seed: 0

optimization_weights:
  connectivity: 100.0
  non_intersection: 0
  target: 0
  arm_symmetry: 0
  void_length: 1.0
  void_collinear: 1.0
  boundary_rigidity: 0
  face_area: 1.0
  anchoring: 2000

physics:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 10
  solver_maxiter: 1000
  solver_tol: 1e-5

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [0]

loads:
  - face: [14]
    dof: 2
    value: -4.0

training:
  num_epochs: 500
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"
  save_plots: true
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 2000.0
  material_area: 50.0
  stretching: 1
  shearing: 10
  bending: 0
  contact: 1
  regularization: 0.0001
  coverage: 1.0
  hinge_gap: 300.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: true
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
