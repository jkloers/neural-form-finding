# ============================================================
# CANONICAL BEST GNN CONFIG — v8 (2026-05-20)
# ============================================================
# This is the reference config encoding all tuned parameters.
# Use this as the base when creating new experiment configs.
#
# KEY FINDINGS:
#   - connectivity >> anchoring (10:1 ratio) is required for hinge closure.
#     Old configs had anchoring=2000 >> connectivity=100 → hinges NEVER closed.
#   - face_area=100 forces rigid-body-only Stage 1 kinematics (no face resizing).
#   - target=200 in Stage 1 ensures boundary circle fit even at low anchoring.
#   - cosine LR schedule + grad_clip=1.0 gives stable training.
#   - hidden_dim=64, num_layers=4, seed=2 → square orientation (ΔArea=-0.28).
#     seed=3 → diamond orientation (ΔArea=-1.0, more visually symmetric RDQK_D).
#
# RESULTS (experience1 BCs/loads):
#   Chamfer=0.036, HingeGap_raw=0.028, ΔArea=-0.28, CLOSED hinges.
#   Gap vs v3_s2 (chamfer=0.020): caused by IFT gradient disconnection.
# ============================================================

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1

mapping:
  map_type: gnn_egnn
  domain_restriction: 1
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 64
    num_layers: 4
    seed: 2             # seed=2 → square orientation; seed=3 → diamond orientation

# Stage 1 geometric validity weights.
# CRITICAL: connectivity >> anchoring (10:1 ratio enables hinge closure).
optimization_weights:
  connectivity: 3000.0  # hinge point distance^2 — must dominate
  non_intersection: 0
  target: 200.0         # Stage 1 also fits circle boundary
  arm_symmetry: 0
  void_length: 500.0    # parallelogram void shape (equal opposite edges)
  void_collinear: 500.0 # parallelogram void shape (collinear opposite edges)
  boundary_rigidity: 0
  face_area: 100.0      # rigid-body Stage 1: no face resizing allowed
  anchoring: 300.0      # keep Stage 1 close to Stage 0 (weak — let connectivity dominate)

physics:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 10
  solver_maxiter: 1000
  solver_tol: 1e-5

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

# --- EXPERIMENT-SPECIFIC: change per task ---
boundary_conditions:
  clamped_faces: [0]    # exp1 default

loads:
  - face: [14]          # exp1 default
    dof: 2
    value: -4.0
# -------------------------------------------

training:
  num_epochs: 500
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"   # decays to 10% of init lr over num_epochs
  save_plots: true
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 2000.0
  material_area: 100.0
  stretching: 1
  shearing: 10
  bending: 0
  contact: 1
  regularization: 0.0001
  coverage: 1.0
  hinge_gap: 400.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: true
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
