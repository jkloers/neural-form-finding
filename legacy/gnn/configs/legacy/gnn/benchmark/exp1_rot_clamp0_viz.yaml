# Benchmark exp1 — clamp=0, face 14 rotation −4  (with visualization)

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1

mapping:
  map_type: gnn_egnn
  domain_restriction: 1
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 64
    num_layers: 4
    seed: 2

optimization_weights:
  connectivity: 100.0
  non_intersection: 0
  target: 0
  arm_symmetry: 0
  void_length: 1.0
  void_collinear: 1.0
  boundary_rigidity: 0
  face_area: 0
  anchoring: 100.0

physics:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 10
  solver_maxiter: 1000
  solver_tol: 1e-5

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: [0]

loads:
  - face: [14]
    dof: 2
    value: -3.0

# boundary_conditions:
#   clamped_faces: []

# loads:
#   - face: []
#     dof: 2
#     value: 0.0

training:
  num_epochs: 1000
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"
  save_plots: false
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 500.0
  material_area: 0.0
  stretching: 1
  shearing: 10
  bending: 0
  contact: 1
  regularization: 0.0001
  coverage: 500.0
  hinge_gap: 1000.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: false
  show_plots: false
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
