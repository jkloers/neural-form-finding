# Benchmark exp2 — no clamp, 4-point symmetric push
# faces [1,4]↑ +5, [10,15]↓ −5, [3,8]← −5, [13,6]→ +5

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1

mapping:
  map_type: gnn_egnn
  domain_restriction: 1
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 64
    num_layers: 4
    seed: 2

optimization_weights:
  connectivity: 3000.0
  non_intersection: 0
  target: 200.0
  arm_symmetry: 0
  void_length: 500.0
  void_collinear: 500.0
  boundary_rigidity: 0
  face_area: 100.0
  anchoring: 300.0

physics:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 10
  solver_maxiter: 1000
  solver_tol: 1e-5

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

boundary_conditions:
  clamped_faces: []

loads:
  - face: [1,4]
    dof: 1
    value: 5.0
  - face: [10,15]
    dof: 1
    value: -5.0
  - face: [3,8]
    dof: 0
    value: -5.0
  - face: [13,6]
    dof: 0
    value: 5.0

training:
  num_epochs: 500
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"
  save_plots: false
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 5000.0
  material_area: 0.0
  stretching: 1
  shearing: 10
  bending: 0
  contact: 1
  regularization: 0.0001
  coverage: 1.0
  hinge_gap: 400.0

visualization:
  stage0: false
  stage1: false
  stage2: false
  energy_plot: false
  animation: false
  show_plots: false
  save_outputs: false
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
