# Test Experiment Configuration for Hierarchical Settings
# Unit system: generic

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1

#(Stage 0)
mapping:
  map_type: "asymmetric_roots" #conformal_polynomial" # ou "elliptical_grip", "homothetic", etc.
  # Paramètres généraux gérés par le Wrapper (Étape 2)
  domain_restriction: 1
  use_shirley_chiu: true
  strict_boundary_fit: false
  learn_global_scale: true
  
  # Ce dictionnaire est passé tel quel à map_params
  map_params:
    tx: 0.0
    ty: 0.0
    # theta est bloqué à 0 en interne comme demandé
    roots: [1.2, 1.2,  -1.2, 1.2,  -1.2, -1.2,  1.2, -1.2]
    weights: [0.5, 0.5, 0.5, 0.5]

optimization_weights:
  connectivity: 100.0
  non_intersection: 0
  target: 0
  arm_symmetry: 0
  void_length: 1.0
  void_collinear: 1.0
  boundary_rigidity: 0
  face_area: 0

physics:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0     # degrees
  cutoff_angle: 5.0  # degrees
  incremental: true
  num_load_steps: 10
  solver_maxiter: 1000
  solver_tol: 1e-5

material:
  k_stretch: 1000.0       # N/mm (calibré expérimentalement pour leurs charnières 3D)
  k_shear: 1000.0          # N/mm (faible résistance au cisaillement dans leur modèle)
  k_rot: 0.5             # N.mm/rad (rigidité en flexion de la charnière)
  density: 1.0

boundary_conditions:
  clamped_faces: [8]

loads:
  - face: [12]
    dof: 2
    value: 10.0
  - face: [7]
    dof: 2
    value: -10.0

training:
  num_epochs: 300
  learning_rate: 0.1
  optimizer: "adam"
  save_plots: true
  geometric_loss_type: "boundary_vertices"  # centroids or boundary_vertices

# Nouveaux coefficients de pondération ajustables :
loss_weights:
  chamfer: 2000.0
  material_area: 0
  stretching: 1
  shearing: 100
  bending: 0
  contact: 1
  regularization: 0.001

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: true
  save_outputs: true
  
  # Nouveaux paramètres de détails (valeurs par défaut)
  show_hinges: true               # Dessiner les charnières et leurs points
  show_hinge_indices: false        # Afficher 'h0', 'h1', etc.
  show_face_indices: true         # Afficher '0', '1' au centre des faces
  show_external_forces: true     # (Pour plus tard)
  show_kinematic_blocks: true