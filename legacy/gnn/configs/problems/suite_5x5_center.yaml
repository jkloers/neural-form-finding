# Benchmark suite — 5×5 RDQK_D tessellation, center-clamped closing
#
# ── Tessellation layout ───────────────────────────────────────────────────────
# 5×5 unit cells → 100 faces total.
# Center hub: face 50, centroid ≈ (7.78, 7.78).
# Center hub neighbors (all degree-4 hubs): 49 (below), 51 (left), 55 (right), 69 (above).
#
# ── Problem ───────────────────────────────────────────────────────────────────
# Clamp center hub (face 50) as rigid pivot.
# Apply same-sign CCW moments to all 4 neighbors.
# All arms rotate in the same direction around the fixed center → symmetric
# "iris" contracting mode. Same-sign is required: alternating signs create
# shear without coordinated closing of the kirigami apertures.
#
# ── Load conventions ─────────────────────────────────────────────────────────
# global_frame: dof=2 (Mz), CCW = positive.

physics_defaults:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 5
  solver_maxiter: 1000
  solver_tol: 1.0e-5

material_defaults:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

problems:

  - id: "p001"
    name: "center_clamp_iris_closing"
    description: |
      Clamp center hub (face 50) as rigid pivot.
      CCW moments (+20) on all 4 direct neighbors simultaneously:
        face 49 (below), face 51 (left), face 55 (right), face 69 (above).
      All arms rotate in the same CCW direction around the fixed pivot,
      driving the symmetric "iris" closing mode of the 5×5 tessellation.
    difficulty: 50
    boundary_conditions:
      clamped_faces: [50]
    loads:
      - type: global_frame
        face: 49
        dof: 2
        value: 5.0
      - type: global_frame
        face: 51
        dof: 2
        value: 5.0
      - type: global_frame
        face: 55
        dof: 2
        value: 5.0
      - type: global_frame
        face: 69
        dof: 2
        value: 5.0
