# Test suite — single problem: interior clamp + 3 neighbour moments
#
# Face layout (16 faces, 0-indexed):
#
#   11  10  15  14    ← top edge    (row 3)
#    8   9  12  13                  (row 2)
#    3   2   7   6                  (row 1)
#    0   1   4   5    ← bottom edge (row 0)
#
#   Interior: 2(r1c1)  7(r1c2)  9(r2c1)  12(r2c2)
#
# Problem: clamp face 9 (most central interior face).
#   Neighbours of 9:  8(left)  10(above)  2(below)  12(right)
#   Apply alternating Mz to 3 of them — leave face 10 (top) free.
#   face 2  → Mz = +4.0  (CCW)
#   face 7  → Mz = -4.0  (CW)
#   face 12 → Mz = +4.0  (CCW)
#
# This creates an inward-spiralling moment field anchored at the centre.

physics_defaults:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 5
  solver_maxiter: 1000
  solver_tol: 1.0e-5

material_defaults:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

problems:
  - id: "p001"
    name: "mid_clamp_3moment"
    description: "Clamp interior face 9; CCW on face 2 and CW on face 7"
    difficulty: 12
    boundary_conditions:
      clamped_faces: [9]
    loads:
      - face: [2]
        dof: 2
        value: 4.0