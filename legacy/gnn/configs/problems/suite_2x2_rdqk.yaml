# Benchmark suite — 2×2 unit_RDQK_D, 100 physical problems
#
# Face layout (16 faces, 0-indexed):
#
#         col0   col1   col2   col3
#  row3:   11     10     15     14   ← top edge     (y≈4.9)
#  row2:    8      9     12     13                  (y≈3.5)
#  row1:    3      2      7      6                  (y≈2.1)
#  row0:    0      1      4      5   ← bottom edge  (y≈0.7)
#          ↑                         ↑
#       left (col0)              right (col3)

#
# Hinge graph — VERIFIED from code:
#   Internal rings: 0-1-2-3-0 | 4-5-6-7-4 | 8-9-10-11-8 | 12-13-14-15-12
#   External:  1↔4  5↔2(diag)  3↔8  7↔2  9↔6(diag)  7↔12  9↔12  15↔10
#   Neighbors: 0:{1,3}  1:{0,2,4}  2:{1,3,5,7}  3:{0,2,8}
#              4:{1,5,7} 5:{2,4,6} 6:{5,7,9}   7:{2,4,6,12}
#              8:{3,9,11} 9:{6,8,10,12} 10:{9,11,15} 11:{8,10}
#              12:{7,9,13,15} 13:{12,14} 14:{13,15} 15:{10,12,14}
#   Hubs(4): 2,7,9,12 | Connectors(3): 1,3,4,5,6,8,10,15 | Corners(2): 0,11,13,14
#
# Geometric corners: 0(BL) 5(BR) 11(TL) 14(TR)
# Topological dead-ends (degree-2): 0, 11, 13, 14
#
# DOF: 0=Fx (→+), 1=Fy (↑+), 2=Mz (CCW+)
#
# Clamp guidelines:
#   Hub clamps (2,7,9,12): high connectivity, efficient constraint propagation.
#   Corner clamps (0,11,13,14): weakly connected — allow more global freedom.
#   Never clamp two hub faces simultaneously.
#   For directional loads, choose a hub NOT on the loaded edge.
#
# Difficulty ≈ Σ|loads| × (1 + 0.3 × n_clamped)   [rough guide only]

physics_defaults:
  use_contact: true
  linearized_strains: true
  updated_lagrangian: false
  k_contact: 5000.0
  min_angle: 1.0
  cutoff_angle: 5.0
  incremental: true
  num_load_steps: 5
  solver_maxiter: 1000
  solver_tol: 1.0e-5

material_defaults:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

