# Architecture: 2×2 RDQK_D grid — direct transform parameterization + alternating projections
#
# COMPARISON LEG B (local Jacobian transform optimization):
# Stage 0: learn centroid positions + per-face 2×2 linear transforms applied to
#           initial tile shapes. CNVs = T_f @ initial_cnvs_f — mirrors GNN output
#           structure without message passing. Initialized to scale*I.
# Stage 1: alternating projections, n_proj_iters=3 — minor corrections only
#           (equivalent to high anchoring weight in L-BFGS Stage 1).
# Stage 2: incremental static physics solver with contact.
#
# Pair with direct_vertices_altproj.yaml for scientific comparison.
# Both configs are identical except for map_type.

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1.0

mapping:
  map_type: direct_transform
  domain_restriction: 1.0
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false

optimization_weights:
  validity_method: alternating_projection
  n_proj_iters: 3
  connectivity: 0.0
  non_intersection: 0.0
  target: 0.0
  arm_symmetry: 0.0
  void_length: 0.0
  void_collinear: 0.0
  boundary_rigidity: 0.0
  face_area: 0.0
  anchoring: 0.0

training:
  num_epochs: 500
  learning_rate: 0.005
  optimizer: "adam"
  lr_schedule: "cosine"
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 5000.0
  coverage: 5000.0
  material_area: 0.0
  stretching: 100.0
  shearing: 100.0
  bending: 0.0
  contact: 0.0
  regularization: 0.0
  hinge_gap: 0.0
  openness: 20.0
  deformation: 15.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: false
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
