# Architecture: direct_transform + full alternating projections + small hinge_gap loss
#
# n_proj_iters: 20 — Stage 1 closes 96% of all hinge gaps before Stage 2.
#   Stage 2 always receives physically valid geometry regardless of Stage 0 gap size.
# hinge_gap: 500 — soft signal to Stage 0 to keep gaps small, reducing Stage 1 work.
#   At the ~320k plateau this contributes ~0.03% of the loss — a nudge, not a penalty.
#
# Fix for the n_proj_iters=3 + hinge_gap=500 instability: with only 3 iterations,
# large Stage 0 gaps were not fully corrected and leaked into Stage 2, causing
# physics divergence on compression problems (c003, c007, c009).

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1.0

mapping:
  map_type: direct_transform
  domain_restriction: 1.0
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false

optimization_weights:
  validity_method: alternating_projection
  n_proj_iters: 20
  connectivity: 0.0
  non_intersection: 0.0
  target: 0.0
  arm_symmetry: 0.0
  void_length: 0.0
  void_collinear: 0.0
  boundary_rigidity: 0.0
  face_area: 0.0
  anchoring: 0.0

training:
  num_epochs: 500
  learning_rate: 0.005
  optimizer: "adam"
  lr_schedule: "cosine"
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 500.0
  coverage: 500.0
  material_area: 0.0
  stretching: 100.0
  shearing: 100.0
  bending: 0.0
  contact: 0.0
  regularization: 0.0
  hinge_gap: 400.0
  openness: 0.0
  deformation: 1.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: false
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
