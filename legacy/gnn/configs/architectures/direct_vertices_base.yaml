# Architecture: 2×2 RDQK_D grid — direct vertex parameterization baseline
#
# Optimizes all unique vertex positions directly with Adam + backprop.
# No GNN, no analytical map — simplest possible Stage 0.
# Stage 1 and Stage 2 are disabled to isolate the pure Stage 0 gradient signal.
#
# Can be run standalone (has material defaults) or paired with a problem suite.
# Use regularization: 0.0 — absolute vertex positions should not be penalized.

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1.0

mapping:
  map_type: direct_vertices
  domain_restriction: 1.0
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false

pipeline:
  use_stage2: false

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

# Override suite physics defaults: disable contact — the flat initial
# configuration has 0° hinge angles which makes contact energy blow up.
physics:
  use_contact: false
  linearized_strains: true
  updated_lagrangian: false
  incremental: true
  num_load_steps: 5
  solver_maxiter: 500
  solver_tol: 1.0e-4

optimization_weights:
  validity_method: none
  connectivity: 0.0
  non_intersection: 0.0
  target: 0.0
  arm_symmetry: 0.0
  void_length: 0.0
  void_collinear: 0.0
  boundary_rigidity: 0.0
  face_area: 0.0
  anchoring: 0.0

training:
  num_epochs: 500
  learning_rate: 0.005
  optimizer: "adam"
  lr_schedule: "cosine"
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 5000.0
  material_area: 0.0
  stretching: 100.0
  shearing: 100.0
  bending: 0.0
  contact: 0.0
  regularization: 0.0
  coverage: 5000.0
  hinge_gap: 0.0
  openness: 20.0
  deformation: 15.0

visualization:
  stage0: false
  stage1: false
  stage2: true
  energy_plot: true
  animation: true
  show_plots: false
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
