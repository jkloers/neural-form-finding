# Architecture: 5×5 RDQK_D grid + MPNN (shallow inner MLPs)
#
# Run 1 baseline: inner_depth=1 (1-layer phi_e/phi_h), 6 message-passing layers,
# same-sign moments=10, hinge_gap=100.
#
# inner_depth=1 rationale: 2-layer inner MLPs with 7 MP layers = 28 tanh ops
# in the gradient path → severe vanishing. 1-layer inner MLPs = 12 tanh ops,
# allowing deeper message passing without gradient collapse.

tessellation:
  width: 5
  height: 5
  pattern: "unit_RDQK_D"
  total_area: 18.75

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 2.5

mapping:
  map_type: gnn_mpnn
  domain_restriction: 1.0
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 64
    num_layers: 6
    inner_depth: 1
    seed: 2

optimization_weights:
  validity_method: alternating_projection
  n_proj_iters: 100

training:
  num_epochs: 1000
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 5000.0
  coverage: 3.0
  material_area: 0.0
  stretching: 1.0
  shearing: 10.0
  bending: 0.0
  contact: 0.0
  regularization: 0.0001
  hinge_gap: 200.0
  openness: 0.0
  deformation: 0.0
  void_closure: 0.0
  closure_delta: 20.0

visualization:
  stage0: true
  stage1: true
  stage2: true
  energy_plot: true
  animation: true
  show_plots: false
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: true
  show_kinematic_blocks: true
