# Architecture: 2×2 RDQK_D grid + hinge-based MPNN
#
# The GNN predicts per-face vertex displacements. Hinge positions are the
# average of the two adjacent face predictions, so hinge gap = 0 by construction.
# No hinge_gap loss term needed.
#
# Start with stage1 disabled to test the hinge parametrization in isolation.

tessellation:
  width: 2
  height: 2
  pattern: "unit_RDQK_D"
  total_area: 3.0

target:
  type: "circle"
  center: [0.0, 0.0]
  radius: 1.0

mapping:
  map_type: gnn_hinge
  domain_restriction: 1.0
  use_shirley_chiu: false
  strict_boundary_fit: false
  learn_global_scale: false
  map_params:
    hidden_dim: 32
    num_layers: 4
    seed: 0

optimization_weights:
  validity_method: none
  connectivity: 3000.0
  non_intersection: 0
  target: 0
  arm_symmetry: 0
  void_length: 500.0
  void_collinear: 500.0
  boundary_rigidity: 0
  face_area: 100.0
  anchoring: 300.0

material:
  k_stretch: 1000.0
  k_shear: 1000.0
  k_rot: 0.5
  density: 1.0

physics:
  use_contact: true
  k_contact: 1.0
  min_angle: 0.1
  cutoff_angle: 5.0
  linearized_strains: true
  incremental: false
  num_load_steps: 10

training:
  num_epochs: 50
  learning_rate: 0.01
  optimizer: "adam"
  lr_schedule: "cosine"
  geometric_loss_type: "boundary_vertices"
  grad_clip: 1.0

loss_weights:
  chamfer: 5000.0
  material_area: 0.0
  stretching: 1.0
  shearing: 10.0
  bending: 0.0
  contact: 1.0
  regularization: 0.0001
  coverage: 1.0
  hinge_gap: 0.0

visualization:
  stage0: true
  stage1: false
  stage2: true
  energy_plot: true
  animation: false
  show_plots: false
  save_outputs: true
  show_hinges: true
  show_hinge_indices: false
  show_external_forces: false
  show_kinematic_blocks: false
